    <path d="M0,0 L10,5 L0,10 z" fill="#5B3E96"/>
  </marker>
    
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#FBF9FE"/>

<text x="450.0" y="32" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#6F5F91" text-anchor="middle" >REPOSITÓRIO LOCAL x REPOSITÓRIO REMOTO</text>
<rect x="60" y="120" width="300" height="160" rx="10" fill="#F1ECFB" stroke="#6C4F9C" stroke-width="2"/>
<text x="210.0" y="164" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B2140" text-anchor="middle" >SEU COMPUTADOR</text>
<text x="210.0" y="194" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6F5F91" text-anchor="middle" >repositório local</text>
<text x="210.0" y="230" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B3E96" text-anchor="middle" >git init</text>
<text x="210.0" y="254" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B3E96" text-anchor="middle" >git commit</text>
<rect x="540" y="120" width="300" height="160" rx="10" fill="#E1D3F6" stroke="#6C4F9C" stroke-width="2"/>
<text x="690.0" y="164" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B2140" text-anchor="middle" >GITHUB</text>
<text x="690.0" y="194" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6F5F91" text-anchor="middle" >repositório remoto</text>
<line x1="366" y1="175" x2="534" y2="175" stroke="#5B3E96" stroke-width="3" marker-end="url(#arrow)"/>
<text x="450.0" y="163" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5B3E96" text-anchor="middle" >git push</text>
<line x1="534" y1="225" x2="366" y2="225" stroke="#5B3E96" stroke-width="3" marker-end="url(#arrow)"/>
