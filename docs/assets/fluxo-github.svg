<text x="450.0" y="330" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6F5F91" text-anchor="middle" >git clone  →  baixa uma cópia completa de um repositório que já existe no GitHub</text>
<text x="450.0" y="356" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="middle" >(usado quando o projeto já existe e você ainda não tem ele localmente)</text>
