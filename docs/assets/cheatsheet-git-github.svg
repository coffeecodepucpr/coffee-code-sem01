<svg viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5B3E96"/>
  </marker>
    
  </defs>
  <rect x="0" y="0" width="900" height="800" fill="#FBF9FE"/>

<text x="450.0" y="36" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2B2140" text-anchor="middle" >CHEAT SHEET — GIT &amp; GITHUB</text>
<text x="450.0" y="60" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6F5F91" text-anchor="middle" >Coffee &amp; Code — referência rápida da Semana 01</text>
<rect x="30.0" y="96" width="400" height="46" rx="8" fill="#F1ECFB" stroke="#6C4F9C" stroke-width="2"/>
<text x="230.0" y="126" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2140" text-anchor="middle" >GIT (local)</text>
<rect x="30.0" y="158" width="400" height="78" rx="6" fill="#FFFFFF" stroke="#6C4F9C" stroke-width="1.5"/>
<text x="46.0" y="188" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#5B3E96" text-anchor="start" >git init</text>
<text x="46.0" y="210" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >transforma a pasta atual em um repositório</text>
<rect x="30.0" y="250" width="400" height="78" rx="6" fill="#FFFFFF" stroke="#6C4F9C" stroke-width="1.5"/>
<text x="46.0" y="280" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#5B3E96" text-anchor="start" >git status</text>
<text x="46.0" y="302" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >mostra o que mudou desde o último commit</text>
<rect x="30.0" y="342" width="400" height="78" rx="6" fill="#FFFFFF" stroke="#6C4F9C" stroke-width="1.5"/>
<text x="46.0" y="372" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#5B3E96" text-anchor="start" >git add &lt;arquivo&gt;</text>
<text x="46.0" y="394" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >coloca o arquivo no staging</text>
<rect x="30.0" y="434" width="400" height="78" rx="6" fill="#FFFFFF" stroke="#6C4F9C" stroke-width="1.5"/>
<text x="46.0" y="464" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#5B3E96" text-anchor="start" >git add .</text>
<text x="46.0" y="486" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >coloca todos os arquivos modificados no</text>
<text x="46.0" y="504" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >staging</text>
<rect x="30.0" y="526" width="400" height="78" rx="6" fill="#FFFFFF" stroke="#6C4F9C" stroke-width="1.5"/>
<text x="46.0" y="556" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#5B3E96" text-anchor="start" >git commit -m "..."</text>
<text x="46.0" y="578" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >registra oficialmente a mudança, com</text>
<text x="46.0" y="596" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >mensagem</text>
<rect x="30.0" y="618" width="400" height="78" rx="6" fill="#FFFFFF" stroke="#6C4F9C" stroke-width="1.5"/>
<text x="46.0" y="648" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#5B3E96" text-anchor="start" >git log --oneline</text>
<text x="46.0" y="670" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >mostra o histórico de commits, resumido</text>
<rect x="470.0" y="96" width="400" height="46" rx="8" fill="#E1D3F6" stroke="#6C4F9C" stroke-width="2"/>
<text x="670.0" y="126" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2B2140" text-anchor="middle" >GITHUB (remoto)</text>
<rect x="470.0" y="158" width="400" height="78" rx="6" fill="#FFFFFF" stroke="#6C4F9C" stroke-width="1.5"/>
<text x="486.0" y="188" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#5B3E96" text-anchor="start" >git clone &lt;url&gt;</text>
<text x="486.0" y="210" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >baixa uma cópia completa de um repositório</text>
<text x="486.0" y="228" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >do GitHub</text>
<rect x="470.0" y="250" width="400" height="78" rx="6" fill="#FFFFFF" stroke="#6C4F9C" stroke-width="1.5"/>
<text x="486.0" y="280" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#5B3E96" text-anchor="start" >git remote add origin &lt;url&gt;</text>
<text x="486.0" y="302" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >conecta o repositório local a um remoto</text>
<rect x="470.0" y="342" width="400" height="78" rx="6" fill="#FFFFFF" stroke="#6C4F9C" stroke-width="1.5"/>
<text x="486.0" y="372" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#5B3E96" text-anchor="start" >git push</text>
<text x="486.0" y="394" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >envia seus commits locais para o GitHub</text>
<rect x="470.0" y="434" width="400" height="78" rx="6" fill="#FFFFFF" stroke="#6C4F9C" stroke-width="1.5"/>
<text x="486.0" y="464" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#5B3E96" text-anchor="start" >git pull</text>
<text x="486.0" y="486" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >traz as mudanças do GitHub para o seu</text>
<text x="486.0" y="504" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >computador</text>
<rect x="470.0" y="526" width="400" height="78" rx="6" fill="#FFFFFF" stroke="#6C4F9C" stroke-width="1.5"/>
<text x="486.0" y="556" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#5B3E96" text-anchor="start" >git branch &lt;nome&gt;</text>
<text x="486.0" y="578" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >cria uma nova linha de desenvolvimento</text>
<rect x="470.0" y="618" width="400" height="78" rx="6" fill="#FFFFFF" stroke="#6C4F9C" stroke-width="1.5"/>
<text x="486.0" y="648" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#5B3E96" text-anchor="start" >git checkout -b &lt;nome&gt;</text>
<text x="486.0" y="670" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6F5F91" text-anchor="start" >cria e já muda para uma nova branch</text>
<text x="450.0" y="740" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6F5F91" text-anchor="middle" >Dúvida rápida: Git é o programa; GitHub é onde ele hospeda o projeto na nuvem.</text>
</svg>