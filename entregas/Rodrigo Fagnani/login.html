<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FixAqui</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <header class="site-header">
        <a class="brand" href="login.html" aria-label="FixAqui - página inicial">FixAqui</a>
        <nav class="main-nav" aria-label="Navegação principal">
            <a class="nav-link nav-link-active" href="login.html">Entrar</a>
            <a class="nav-link" href="dashboard.html">Explorar serviços</a>
        </nav>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-labelledby="login-title">
            <div class="auth-heading">
                <span class="eyebrow">Bem-vindo ao FixAqui</span>
                <h1 id="login-title">Entre na sua conta</h1>
                <p>Encontre profissionais para resolver seus serviços de forma simples.</p>
            </div>

            <form class="form" action="dashboard.html" method="get">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input class="input" type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input class="input" type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
                </div>

                <button class="button button-primary button-full" type="submit">Entrar</button>
            </form>

            <p class="auth-footer-text">
                Não possui uma conta?
                <a href="perfil.html">Criar conta</a>
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 FixAqui. Projeto acadêmico.</p>
    </footer>
</body>
</html>
